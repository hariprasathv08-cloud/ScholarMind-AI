services:
  - type: web
    name: scholarmind-ai
    runtime: node
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: LOVABLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
