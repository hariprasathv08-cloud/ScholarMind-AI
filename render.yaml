services:
  - type: web
    name: scholarmind-ai
    runtime: node
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scholarmind-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOVABLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: UPLOADS_DIR
        value: /uploads
    disk:
      name: scholarmind-uploads
      mountPath: /uploads
      sizeGB: 1

databases:
  - name: scholarmind-db
